name: bidatask
description: "BidaTask - Crowdsourcing errand service mobile application"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Real-time Chat dependencies
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  bloc: ^8.1.4
  
  # Supabase
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0
  
  # Utility
  intl: ^0.19.0
  
  # WebSocket for real-time messaging
  web_socket_channel: ^2.4.0
  
  # File handling
  file_picker: ^10.3.7
  
  # UUID for message IDs
  uuid: ^4.2.1
  
  # Location Services
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  
  # Utils
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Fonts
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

